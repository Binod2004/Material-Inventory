<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vizag Steel Inventory - Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Admin Login</h1>
        <form action="index.html" method="get">
          <label>Username<input name="username" value="admin" required /></label>
          <label>Password<input type="password" name="password" value="admin123" required /></label>
          <button type="submit">Login</button>
          <div class="login-note">Use <strong>admin</strong> / <strong>admin123</strong> to preview the dashboard.</div>
        </form>
      </div>
    </div>
  </body>
</html>
